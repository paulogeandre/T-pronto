<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850"><rect width="1200" height="850" fill="white"/><g font-family="Arial, sans-serif" fill="#222"><text x="24" y="34" font-size="20" font-weight="700">TÁPRONTO | WIREFRAME DE BAIXA FIDELIDADE</text><text x="24" y="59" font-size="13" font-weight="400">Tela 2 de 3 · Controle de estoque · Estrutura sem identidade visual</text><rect x="24" y="84" width="1152" height="635" fill="#fff" stroke="#555" stroke-width="1.5" /><rect x="24" y="84" width="176" height="635" fill="#f3f3f3" stroke="#555" stroke-width="1.5" /><text x="42" y="121" font-size="18" font-weight="700">[Logo TáPronto]</text><text x="42" y="151" font-size="12" font-weight="400">Menu principal</text><rect x="32" y="236" width="156" height="40" fill="#fff" stroke="#555" stroke-width="1.5" /><text x="46" y="261" font-size="15" font-weight="400">Pedidos</text><rect x="32" y="291" width="156" height="40" fill="#ddd" stroke="#555" stroke-width="1.5" /><text x="46" y="316" font-size="15" font-weight="700">Estoque</text><rect x="32" y="346" width="156" height="40" fill="#fff" stroke="#555" stroke-width="1.5" /><text x="46" y="371" font-size="15" font-weight="400">Dashboard</text><text x="42" y="680" font-size="11" font-weight="400">[Área de identificação]</text><text x="226" y="121" font-size="24" font-weight="700">Controle de estoque</text><text x="226" y="149" font-size="13" font-weight="400">Consulta de saldos, mínimos e ficha técnica</text><path d="M226 170H1154" stroke="#888"/><rect x="226" y="191" width="918" height="49" fill="#eee" stroke="#555" stroke-width="1.5" /><text x="242" y="221" font-size="14" font-weight="700">[Alerta de estoque mínimo] Bacon: 12 fatias disponíveis · mínimo: 20</text><rect x="226" y="263" width="918" height="246" fill="#fff" stroke="#555" stroke-width="1.5" /><rect x="226" y="263" width="918" height="42" fill="#ddd" stroke="#555" stroke-width="1.5" /><text x="245" y="290" font-size="13" font-weight="700">Ingrediente</text><text x="610" y="290" font-size="13" font-weight="700">Saldo atual</text><text x="785" y="290" font-size="13" font-weight="700">Estoque mínimo</text><text x="990" y="290" font-size="13" font-weight="700">Situação</text><text x="245" y="337" font-size="13" font-weight="400">Pão de hambúrguer</text><text x="610" y="337" font-size="13" font-weight="400">24 un.</text><text x="785" y="337" font-size="13" font-weight="400">10 un.</text><text x="990" y="337" font-size="13" font-weight="400">Disponível</text><path d="M226 352H1144" stroke="#888"/><text x="245" y="386" font-size="13" font-weight="400">Hambúrguer</text><text x="610" y="386" font-size="13" font-weight="400">22 un.</text><text x="785" y="386" font-size="13" font-weight="400">10 un.</text><text x="990" y="386" font-size="13" font-weight="400">Disponível</text><path d="M226 401H1144" stroke="#888"/><text x="245" y="435" font-size="13" font-weight="400">Bacon</text><text x="610" y="435" font-size="13" font-weight="400">12 fatias</text><text x="785" y="435" font-size="13" font-weight="400">20 fatias</text><text x="990" y="435" font-size="13" font-weight="400">REPOR</text><path d="M226 450H1144" stroke="#888"/><text x="245" y="484" font-size="13" font-weight="400">Queijo</text><text x="610" y="484" font-size="13" font-weight="400">34 fatias</text><text x="785" y="484" font-size="13" font-weight="400">15 fatias</text><text x="990" y="484" font-size="13" font-weight="400">Disponível</text><path d="M226 499H1144" stroke="#888"/><rect x="226" y="538" width="918" height="119" fill="#fafafa" stroke="#555" stroke-width="1.5" stroke-dasharray="6 5"/><text x="244" y="566" font-size="16" font-weight="700">Ficha técnica de referência — X-Bacon</text><text x="244" y="594" font-size="13" font-weight="400">1 pão + 1 hambúrguer + 2 fatias de bacon + 1 fatia de queijo por unidade.</text><text x="244" y="625" font-size="12" font-weight="400">[Quantidade de pratos] × [consumo por ingrediente] = [baixa no estoque]</text><text x="24" y="751" font-size="13" font-weight="700">COMPORTAMENTO E NAVEGAÇÃO</text><text x="24" y="777" font-size="12" font-weight="400">1. Ao passar de Novo para Em preparo, descontar os ingredientes pela ficha técnica, uma única vez.</text><text x="24" y="800" font-size="12" font-weight="400">2. Se o saldo for igual ou inferior ao mínimo, exibir alerta com o nome do ingrediente.</text><text x="24" y="823" font-size="12" font-weight="400">3. Nesta tela, os saldos são apenas consultados. Cadastro e reposição não integram este wireframe.</text><text x="24" y="836" font-size="11" font-weight="400">Projeto Integrador · Paulo Geandre · Fellipe Augusto · Rennan Jackowski</text></g></svg>