226" y="683" font-size="12" font-weight="400">Legenda: [No prazo]   [Atenção ≥ 80% do limite]   [Atrasado > limite]</text><text x="24" y="751" font-size="13" font-weight="700">COMPORTAMENTO E NAVEGAÇÃO</text><text x="24" y="777" font-size="12" font-weight="400">1. Menu lateral alterna entre as três telas. O filtro seleciona os pedidos por plataforma.</text><text x="24" y="800" font-size="12" font-weight="400">2. Botões avançam uma etapa por vez. O cronômetro reinicia na mudança; o histórico preserva o tempo total.</text><text x="24" y="823" font-size="12" font-weight="400">3. No produto final: atenção em amarelo e atraso em vermelho; texto de estado acompanha a cor.</text><text x="24" y="836" font-size="11" font-weight="400">Projeto Integrador · Paulo Geandre · Fellipe Augusto · Rennan Jackowski</text></g></svg>