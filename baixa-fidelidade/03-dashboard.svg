roke="#555" stroke-width="1.5" /><text x="554" y="258" font-size="14" font-weight="700">Tempo médio até expedição</text><text x="554" y="305" font-size="30" font-weight="700">18 min</text><text x="554" y="337" font-size="11" font-weight="400">Apenas pedidos expedidos</text><rect x="850" y="230" width="294" height="126" fill="#f7f7f7" stroke="#555" stroke-width="1.5" /><text x="866" y="258" font-size="14" font-weight="700">Pedidos atrasados</text><text x="866" y="305" font-size="30" font-weight="700">3</text><text x="866" y="337" font-size="11" font-weight="400">Ativos fora do limite</text><rect x="226" y="383" width="554" height="265" fill="#fff" stroke="#555" stroke-width="1.5" /><text x="244" y="412" font-size="17" font-weight="700">Pedidos por plataforma</text><text x="245" y="465" font-size="13" font-weight="400">iFood</text><rect x="315" y="448" width="375" height="25" fill="#f4f4f4" stroke="#555" stroke-width="1.5" /><rect x="315" y="448" width="260" height="25" fill="#aaa" stroke="#555" stroke-width="1.5" /><text x="710" y="465" font-size="13" font-weight="700">12</text><text x="245" y="526" font-size="13" font-weight="400">Rappi</text><rect x="315" y="509" width="375" height="25" fill="#f4f4f4" stroke="#555" stroke-width="1.5" /><rect x="315" y="509" width="173" height="25" fill="#aaa" stroke="#555" stroke-width="1.5" /><text x="710" y="526" font-size="13" font-weight="700">8</text><text x="245" y="587" font-size="13" font-weight="400">99Food</text><rect x="315" y="570" width="375" height="25" fill="#f4f4f4" stroke="#555" stroke-width="1.5" /><rect x="315" y="570" width="87" height="25" fill="#aaa" stroke="#555" stroke-width="1.5" /><text x="710" y="587" font-size="13" font-weight="700">4</text><rect x="800" y="383" width="344" height="265" fill="#fafafa" stroke="#555" stroke-width="1.5" stroke-dasharray="6 5"/><text x="818" y="412" font-size="16" font-weight="700">Critérios dos indicadores</text><text x="818" y="447" font-size="12" font-weight="400">Recebidos: pedidos do dia por canal.</text><text x="818" y="485" font-size="12" font-weight="400">Tempo médio: recebimento → expedição.</text><text x="818" y="523" font-size="12" font-weight="400">Atrasos: limite da etapa ultrapassado.</text><text x="818" y="571" font-size="12" font-weight="400">[Dados ilustrativos de interface]</text><text x="818" y="600" font-size="12" font-weight="400">Não representam pesquisa de campo.</text><text x="24" y="751" font-size="13" font-weight="700">COMPORTAMENTO E NAVEGAÇÃO</text><text x="24" y="777" font-size="12" font-weight="400">1. Indicadores usam o dia local. Tempo médio considera os pedidos expedidos no dia.</text><text x="24" y="800" font-size="12" font-weight="400">2. O gráfico compara a quantidade de pedidos recebidos de cada plataforma.</text><text x="24" y="823" font-size="12" font-weight="400">3. Os valores apresentados são exemplos para demonstrar a disposição das informações.</text><text x="24" y="836" font-size="11" font-weight="400">Projeto Integrador · Paulo Geandre · Fellipe Augusto · Rennan Jackowski</text></g></svg>